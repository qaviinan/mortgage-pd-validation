[project]
name = "pdval"
version = "0.1.0"
description = "Mortgage PD model + independent validation battery (Project 1)"

authors = [
    { name = "qaviinan", email = "work.qavi@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "optbinning>=0.21.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.52.0",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
